<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <header>
        <h1>Expense Tracker</h1>
        <p>Manage your income and expenses easily</p>
    </header>

    <section class="summary">
        <div class="summary-card">
            <h3>Total Income</h3>
            <p id="total-income">₹0.00</p>
        </div>
        <div class="summary-card">
            <h3>Total Expenses</h3>
            <p id="total-expense">₹0.00</p>
        </div>
        <div class="summary-card">
            <h3>Balance</h3>
            <p id="balance">₹0.00</p>
        </div>
    </section>

    <section class="form-section">
        <h2>Add Transaction</h2>

        <form id="transaction-form">
            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" required>
                    <option value="">Select Type</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount" min="1" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Salary">Salary</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="Enter description" maxlength="100" required>
            </div>

            <button type="submit" id="submit-button">Add Transaction</button>
            <p id="error-message"></p>
        </form>
    </section>

    <section class="monthly-section">
        <h2>Monthly Expense Summary</h2>

        <div class="month-selector">
            <label for="month-filter">Select Month</label>
            <input type="month" id="month-filter">
        </div>

        <div class="monthly-summary">
            <div class="monthly-card">
                <h3>Monthly Income</h3>
                <p id="monthly-income">₹0.00</p>
            </div>
            <div class="monthly-card">
                <h3>Monthly Expenses</h3>
                <p id="monthly-expense">₹0.00</p>
            </div>
            <div class="monthly-card">
                <h3>Monthly Balance</h3>
                <p id="monthly-balance">₹0.00</p>
            </div>
        </div>
    </section>

    <section class="chart-section">
        <h2>Expense by Category</h2>
        <div id="category-chart"></div>
    </section>

    <section class="transactions-section">
        <div class="transaction-header">
            <h2>Transactions</h2>

            <div class="filters">
                <select id="type-filter">
                    <option value="all">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="Salary">Salary</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Health">Health</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div id="transaction-list">
            <p class="no-transactions">No transactions added yet.</p>
        </div>
    </section>

</div>

<script src="script.js"></script>
</body>
</html>
